
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARKIRKU</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #172033;
}
header {
  background: #101d35;
  color: white;
  padding: 25px 20px;
}
header h1 {
  font-size: 27px;
}
header p {
  color: #b9c8dc;
  margin-top: 6px;
}
.container {
  max-width: 950px;
  margin: 25px auto;
  padding: 0 15px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0000000b;
}
.card p {
  color: #718096;
  font-size: 13px;
}
.card h2 {
  font-size: 19px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
.section {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px #0000000b;
}
.section h3 {
  margin-bottom: 18px;
}
label {
  display: block;
  margin: 12px 0 7px;
  font-size: 14px;
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d5dce6;
  border-radius: 8px;
  font-size: 15px;
}
button {
  border: none;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.submit {
  background: #1765d1;
  color: white;
  width: 100%;
  margin-top: 18px;
}
.export {
  background: #13865b;
  color: white;
}
.delete {
  background: #ffe5e5;
  color: #c62828;
  padding: 8px 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}
th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #e8edf3;
  text-align: left;
  font-size: 13px;
}
th {
  background: #f3f6fa;
}
.table-wrap {
  overflow-x: auto;
}
.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}
#search {
  max-width: 230px;
}
footer {
  text-align: center;
  padding: 20px;
  color: #778397;
  font-size: 12px;
}
@media(max-width:600px) {
  .cards {
    grid-template-columns: 1fr;
  }
  .actions {
    align-items: stretch;
    flex-direction: column;
  }
  #search {
    max-width: 100%;
  }
}
</style>
</head>
<body>

<header>
  <h1>🅿️ PARKIRKU</h1>
  <p>Sistem Pengelolaan Keuangan Parkir</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <p>💰 Pendapatan Hari Ini</p>
      <h2 id="today">Rp0</h2>
    </div>
    <div class="card">
      <p>💵 Total Pendapatan</p>
      <h2 id="total">Rp0</h2>
    </div>
    <div class="card">
      <p>🚗 Total Kendaraan</p>
      <h2 id="count">0</h2>
    </div>
  </div>

  <div class="section">
    <h3>➕ Catat Parkir Baru</h3>

    <form id="parkingForm">

      <label>Jenis Kendaraan</label>
      <select id="vehicle" required>
        <option value="">Pilih kendaraan</option>
        <option value="Motor">Motor</option>
        <option value="Mobil">Mobil</option>
        <option value="Truk">Truk</option>
        <option value="Bus">Bus</option>
      </select>

      <label>Nomor Polisi</label>
      <input id="plate" placeholder="Contoh: G 1234 AB" required>

      <label>Tarif Parkir (Rp)</label>
      <input id="price" type="number" min="1"
        placeholder="Contoh: 2000" required>

      <label>Metode Pembayaran</label>
      <select id="payment">
        <option value="Tunai">Tunai</option>
        <option value="Non-Tunai">Non-Tunai</option>
      </select>

      <label>Tanggal dan Waktu</label>
      <input id="date" type="datetime-local" required>

      <button class="submit" type="submit">
        SIMPAN TRANSAKSI
      </button>

    </form>
  </div>

  <div class="section">
    <div class="actions">
      <h3>📋 Riwayat Parkir</h3>
      <button class="export" onclick="exportCSV()">
        Unduh Laporan
      </button>
    </div>

    <input id="search" placeholder="Cari nomor polisi..."
      oninput="showData()">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Kendaraan</th>
            <th>Nomor Polisi</th>
            <th>Tarif</th>
            <th>Pembayaran</th>
            <th>Waktu</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  PARKIRKU © 2026 | Sistem Keuangan Parkir
</footer>

<script>
const rupiah = angka =>
  new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(angka);

let data = JSON.parse(
  localStorage.getItem("parkirku_data") || "[]"
);

function saveData() {
  localStorage.setItem("parkirku_data",
    JSON.stringify(data));
}

function setDate() {
  const now = new Date();
  const local = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  );
  document.getElementById("date").value =
    local.toISOString().slice(0, 16);
}

document.getElementById("parkingForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  const vehicle = document.getElementById("vehicle").value;
  const plate = document.getElementById("plate").value
    .trim().toUpperCase();
  const price = Number(document.getElementById("price").value);
  const payment = document.getElementById("payment").value;
  const date = document.getElementById("date").value;

  if (!vehicle || !plate || price <= 0 || !date ||
      !Number.isFinite(price)) {
    alert("Mohon isi semua data dengan benar!");
    return;
  }

  data.unshift({
    id: Date.now() + Math.random(),
    vehicle,
    plate,
    price,
    payment,
    date
  });

  saveData();
  showData();

  this.reset();
  setDate();

  alert("Transaksi parkir berhasil disimpan!");
});

function showData() {
  const today = new Date().toLocaleDateString("en-CA");

  const incomeToday = data
    .filter(item => item.date.slice(0, 10) === today)
    .reduce((sum, item) => sum + item.price, 0);

  const incomeTotal = data.reduce(
    (sum, item) => sum + item.price, 0
  );

  document.getElementById("today").textContent =
    rupiah(incomeToday);

  document.getElementById("total").textContent =
    rupiah(incomeTotal);

  document.getElementById("count").textContent =
    data.length;

  const search = document.getElementById("search")
    .value.toLowerCase();

  const filtered = data.filter(item =>
    item.plate.toLowerCase().includes(search)
  );

  const history = document.getElementById("history");

  if (filtered.length === 0) {
    history.innerHTML =
      '<tr><td colspan="7">Belum ada transaksi parkir.</td></tr>';
    return;
  }

  history.innerHTML = filtered.map((item, index) => `
    <tr>
      <td>${index + 1}</td>
      <td>${escapeHTML(item.vehicle)}</td>
      <td>${escapeHTML(item.plate)}</td>
      <td>${rupiah(item.price)}</td>
      <td>${escapeHTML(item.payment)}</td>
      <td>${escapeHTML(item.date.replace("T", " "))}</td>
      <td>
        <button class="delete"
          onclick="deleteData(${JSON.stringify(item.id)})">
          Hapus
        </button>
      </td>
    </tr>
  `).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function deleteData(id) {
  if (confirm("Hapus transaksi ini?")) {
    data = data.filter(item => item.id !== id);
    saveData();
    showData();
  }
}

function exportCSV() {
  if (data.length === 0) {
    alert("Belum ada data untuk diunduh!");
    return;
  }

  const rows = [
    ["Kendaraan", "Nomor Polisi", "Tarif",
     "Pembayaran", "Tanggal"],
    ...data.map(item => [
      item.vehicle,
      item.plate,
      item.price,
      item.payment,
      item.date
    ])
  ];

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value).replace(/"/g, '""') + '"'
    ).join(";")
  ).join("\n");

  const blob = new Blob([csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "laporan-parkir.csv";
  link.click();
  URL.revokeObjectURL(url);
}

setDate();
showData();
</script>

</body>
</html>
